# Codemagic CI configuration.
#
# The iOS app lives in a monorepo subfolder (apps/ios) and its .xcodeproj is
# generated from project.yml via XcodeGen rather than committed, so every
# workflow runs `xcodegen generate` before building. This first workflow builds
# for the simulator and runs the unit/UI tests without code signing, so it
# succeeds on a runner with no certificates (matches the Debug config, which
# sets CODE_SIGNING_ALLOWED=NO).
workflows:
  ios-build-test:
    name: iOS build & test
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.4
      vars:
        XCODE_PROJECT: "OrionisControl.xcodeproj"
        XCODE_SCHEME: "OrionisControl"
        IOS_DIR: "apps/ios"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
        - pattern: "feat/*"
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd "$IOS_DIR"
          xcodegen generate
      - name: Resolve Swift Package dependencies
        script: |
          set -euo pipefail
          cd "$IOS_DIR"
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Build & run tests (no signing)
        script: |
          # pipefail so a failed xcodebuild isn't masked by xcpretty's exit code.
          set -euo pipefail
          cd "$IOS_DIR"
          # -derivedDataPath keeps build output inside apps/ios/build so the
          # artifact glob below can find it. OS is left unpinned so the runner
          # picks whatever iPhone 15 simulator runtime is installed.
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            clean build test | xcpretty
    artifacts:
      - $IOS_DIR/build/Build/Products/**/*.app
      - /tmp/xcodebuild_logs/*.log

  # Produces an UNSIGNED, device-arch .ipa for sideloading via AltStore/SideStore,
  # which re-sign the app with your own Apple ID at install time. No Apple
  # Developer account or Codemagic signing setup required. This workflow is
  # manual-only (no triggering block) so it doesn't double-build on every push;
  # start it from the Codemagic UI when you want a fresh IPA.
  ios-unsigned-ipa:
    name: iOS unsigned IPA (AltStore sideload)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.4
      vars:
        XCODE_PROJECT: "OrionisControl.xcodeproj"
        XCODE_SCHEME: "OrionisControl"
        IOS_DIR: "apps/ios"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          cd "$IOS_DIR"
          xcodegen generate
      - name: Resolve Swift Package dependencies
        script: |
          set -euo pipefail
          cd "$IOS_DIR"
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"
      - name: Build unsigned device app
        script: |
          set -euo pipefail
          cd "$IOS_DIR"
          # generic/platform=iOS -> arm64 device build (not the simulator).
          # Signing fully disabled; AltStore re-signs on install.
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build | xcpretty
      - name: Package unsigned .ipa
        script: |
          set -euo pipefail
          cd "$IOS_DIR"
          APP_PATH="build/Build/Products/Release-iphoneos/OrionisControl.app"
          rm -rf Payload OrionisControl.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          # An .ipa is just a zip with the .app inside a top-level Payload/ dir.
          zip -qr OrionisControl.ipa Payload
          echo "Built unsigned IPA:"
          ls -lh OrionisControl.ipa
    artifacts:
      - $IOS_DIR/OrionisControl.ipa
