# XcodeGen project definition.
#
# The .xcodeproj is generated rather than committed so the project file never
# becomes a merge-conflict battleground and CI builds exactly what the repo
# describes. Run `xcodegen generate` in this directory before opening Xcode.

name: OrionisControl
options:
  bundleIdPrefix: com.lostmediastudios
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

configs:
  Debug: debug
  Staging: release
  Release: release

packages:
  # Google's libwebrtc, distributed as a prebuilt binary XCFramework. This is
  # the media plane for sub-second live camera playback; the gateway proxies the
  # SDP offer/answer and mints per-session TURN credentials, so go2rtc is never
  # exposed. Its ObjC types are not Sendable-annotated, which surfaces as
  # strict-concurrency *warnings* (not errors, since warnings-as-errors is off).
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    # Each upstream release is its own major, so `from:` pins to exactly this one
    # (>=137.0.0, <138.0.0). A prebuilt, ABI-stable XCFramework — loads on the
    # runner's Xcode 16 with the iOS 17 deployment target.
    from: "137.0.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CLANG_ENABLE_MODULES: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    DEAD_CODE_STRIPPING: YES
    ENABLE_BITCODE: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
    Staging:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  OrionisControl:
    type: application
    platform: iOS
    sources:
      - path: OrionisControl
        excludes:
          - "**/.DS_Store"
    resources:
      - path: OrionisControl/Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lostmediastudios.orioniscontrol
        # PRODUCT_NAME must stay space-free: it names the .app bundle and its
        # executable, and a space breaks the unit-test target's TEST_HOST path
        # ("Orionis Control.app" vs the expected "OrionisControl.app"). The
        # user-visible name is set via CFBundleDisplayName below.
        PRODUCT_NAME: OrionisControl
        INFOPLIST_FILE: OrionisControl/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_CATALYST: NO
        # Overridden per environment by Config/*.xcconfig (see the examples).
        ORIONIS_API_BASE_URL: ""
        ORIONIS_OAUTH_CLIENT_ID: orionis-control-mobile
        ORIONIS_OAUTH_REDIRECT_SCHEME: orioniscontrol
        ORIONIS_BUILD_ENVIRONMENT: development
      configs:
        Debug:
          # Signing is intentionally unset so pull-request builds succeed on a
          # runner with no certificates. Release/TestFlight supply their own.
          CODE_SIGNING_ALLOWED: NO
        Staging:
          ORIONIS_BUILD_ENVIRONMENT: staging
        Release:
          ORIONIS_BUILD_ENVIRONMENT: production
    info:
      path: OrionisControl/Info.plist
      properties:
        CFBundleDisplayName: Orionis Control
        CFBundleShortVersionString: "0.2.5"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
          - audio
        # No arbitrary-loads exception: TLS is required everywhere.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSFaceIDUsageDescription: >-
          Orionis Control uses Face ID to unlock the app and to confirm
          administrator actions such as pausing DNS protection.
        NSCameraUsageDescription: >-
          Orionis Control does not use the device camera. This entry is present
          only because a linked framework declares the capability.
        NSMicrophoneUsageDescription: >-
          Orionis Control uses the microphone only when you start two-way audio
          with a camera that supports it.
        NSPhotoLibraryAddUsageDescription: >-
          Orionis Control saves camera snapshots to your photo library when you
          tap Save.
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.lostmediastudios.orioniscontrol.auth
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(ORIONIS_OAUTH_REDIRECT_SCHEME)
        ORIONIS_API_BASE_URL: $(ORIONIS_API_BASE_URL)
        ORIONIS_OAUTH_CLIENT_ID: $(ORIONIS_OAUTH_CLIENT_ID)
        ORIONIS_OAUTH_REDIRECT_SCHEME: $(ORIONIS_OAUTH_REDIRECT_SCHEME)
        ORIONIS_BUILD_ENVIRONMENT: $(ORIONIS_BUILD_ENVIRONMENT)
    dependencies:
      - package: WebRTC

  OrionisControlTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OrionisControlTests
    dependencies:
      - target: OrionisControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lostmediastudios.orioniscontrol.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

  OrionisControlUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - OrionisControlUITests
    dependencies:
      - target: OrionisControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lostmediastudios.orioniscontrol.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  OrionisControl:
    build:
      targets:
        OrionisControl: all
        OrionisControlTests: [test]
        OrionisControlUITests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OrionisControlTests
        - OrionisControlUITests
    run:
      config: Debug
    archive:
      config: Release
