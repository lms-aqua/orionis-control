title = "Orionis Control secret scanning"

[extend]
useDefault = true

[[rules]]
id = "orionis-authelia-client-secret"
description = "Authelia OIDC client secret assigned a real value"
regex = '''(?i)AUTHELIA_CLIENT_SECRET\s*[:=]\s*(?!REPLACE_ME|""|''|\s*$)[^\s"']{8,}'''
tags = ["orionis", "oidc"]

[[rules]]
id = "orionis-session-signing-key"
description = "Session signing key assigned a real value"
regex = '''(?i)SESSION_SIGNING_KEY\s*[:=]\s*(?!REPLACE_ME|""|''|\s*$)[^\s"']{16,}'''
tags = ["orionis"]

[[rules]]
id = "orionis-adguard-password"
description = "AdGuard credentials assigned a real value"
regex = '''(?i)ADGUARD_PASSWORD\s*[:=]\s*(?!REPLACE_ME|""|''|\s*$)[^\s"']{4,}'''
tags = ["orionis", "adguard"]

[[rules]]
id = "apns-auth-key"
description = "APNs .p8 signing key material"
regex = '''-----BEGIN PRIVATE KEY-----'''
tags = ["apple", "apns"]

[allowlist]
description = "Placeholders, fixtures and test-only values"
paths = [
  '''\.env\.example$''',
  '''\.xcconfig\.example$''',
  '''packages/api-contract/openapi\.json$''',
]
regexes = [
  '''REPLACE_ME[A-Z_0-9]*''',
  '''test-signing-key-that-is-definitely-long-enough-0123456789''',
  '''test-client-secret''',
  # RFC 7636 Appendix B published test vector.
  '''dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk''',
  '''E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM''',
]
