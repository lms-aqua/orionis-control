# Blink bridge: lostblink + MediaMTX.
#
# One of a fixed set of templates the applier will run. Nothing in this file is
# supplied by the gateway or the app — the only variable is ${ORIONIS_INSTANCE},
# which the applier sets from a validated slug, plus the account this bridge
# signs in with. That is the whole of the trust boundary: an administrator can
# ask for *this*, unmodified, and cannot ask for anything else.
#
# Two deliberate departures from the stock lostblink compose file:
#
#   1. **No published ports.** The stock file exposes 8554 on the host. Here the
#      gateway joins this project's network instead, so the streams are reachable
#      by exactly one container and by nothing else on the LAN.
#   2. **The MediaMTX control API is on.** It is off in stock MediaMTX and absent
#      from lostblink's shipped config, which is why the Blink provider had
#      nothing to enumerate — it needs /v3/paths/list to know which cameras are
#      publishing.

services:
  # Writes the config lostblink requires. A sidecar rather than a bind mount:
  # a bind mount would mean this template names a host path, and "no template
  # touches the host filesystem" is a property worth keeping absolute.
  config:
    image: busybox:1.36
    container_name: orionis-${ORIONIS_INSTANCE}-lostblink-config
    # Root, then chown the result to lostblink's uid below. Running the sidecar
    # *as* 1000 only worked because the volume already existed owned that way: a
    # genuinely fresh named volume is root-owned, and this is the first container
    # to mount it, so it could not write its own config on a clean install.
    volumes:
      - config:/config
    # Credentials are *not* written here — they arrive as environment variables
    # on the service that needs them, so they never touch a file in a volume.
    #
    # Everything below that is a *choice* rather than a constant comes from the
    # connection. These used to be literals in this file, which made the only
    # way to change one an edit to a file inside a volume — and this sidecar
    # rewrote it on the next reconcile, so the change did not survive.
    environment:
      ORIONIS_LIVEMODE: ${ORIONIS_LIVEMODE:-on_motion}
      ORIONIS_REQUIREBATTERYOK: ${ORIONIS_REQUIREBATTERYOK:-true}
      ORIONIS_DAILYBUDGETSECONDS: ${ORIONIS_DAILYBUDGETSECONDS:-1800}
      ORIONIS_MAXSESSIONSPERHOUR: ${ORIONIS_MAXSESSIONSPERHOUR:-6}
    command:
      - sh
      - -c
      # An unquoted heredoc, so the *shell* substitutes at runtime. The `$$`
      # keeps compose from interpolating these itself at config time, which
      # would bake one connection's settings into the template's rendered form.
      - |
        cat > /config/config.json <<JSON
        {
          "blink": { "poll_interval": 30, "history_days": 7, "request_timeout": 30 },
          "live": {
            "mode": "$${ORIONIS_LIVEMODE}",
            "max_sessions_per_hour": $${ORIONIS_MAXSESSIONSPERHOUR},
            "min_seconds_between_sessions": 60,
            "daily_seconds_budget": $${ORIONIS_DAILYBUDGETSECONDS},
            "require_battery_ok": $${ORIONIS_REQUIREBATTERYOK},
            "mains_powered": []
          },
          "cameras": { "enabled": [], "disabled": [], "max_failures": 5 },
          "rtsp": { "address": "mediamtx", "port": 8554, "transport": "tcp" },
          "ffmpeg": { "hwaccel": "", "loglevel": "error" },
          "paths": { "work": "/working", "config": "/config" },
          "log_level": "INFO"
        }
        JSON
        # lostblink runs as 1000 and only reads this file; the credentials it
        # signs in with arrive as environment, not from here.
        chown 1000:1000 /config/config.json
        chmod 644 /config/config.json
    restart: "no"

  lostblink:
    # Built on this host, once, by hand — see README.md. The template names a
    # tag rather than a build context because the source repository is private
    # and this script has no credentials, by design.
    image: ${ORIONIS_LOSTBLINK_IMAGE:-lostblink:local}
    container_name: orionis-${ORIONIS_INSTANCE}-lostblink
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully
      mediamtx:
        # Upstream starts both at once, so ffmpeg publishes before MediaMTX is
        # listening, burns lostblink's failure counters, and can disable cameras
        # on a cold start.
        condition: service_healthy
    environment:
      LOSTBLINK_CONFIG: /config/config.json
      # Supplied by the applier from the connection's own credentials. Env
      # rather than the config file so the password is never written to a
      # volume that outlives the container.
      LOSTBLINK_USERNAME: ${ORIONIS_EMAIL:-}
      LOSTBLINK_PASSWORD: ${ORIONIS_PASSWORD:-}
      PYTHONUNBUFFERED: "1"
    volumes:
      - config:/config
      - working:/working
    security_opt:
      - no-new-privileges:true
    tty: true

  mediamtx:
    image: bluenviron/mediamtx:1.9.3
    container_name: orionis-${ORIONIS_INSTANCE}-mediamtx
    restart: unless-stopped
    environment:
      # Configured entirely through MTX_* overrides so this template needs no
      # config file and therefore no host path.
      MTX_LOGLEVEL: info
      # The control API is what the Blink provider reads to discover which
      # cameras are live. Bound inside the project network only.
      MTX_API: "yes"
      MTX_APIADDRESS: :9997
      # Switching the API on is not enough to be able to call it. MediaMTX's
      # default internal user grants publish, read and playback — and *not* api,
      # so /v3/paths/list answered 401 to the one caller it exists for. The
      # provider read that as an unreachable source, the aggregate turned it into
      # "No camera connection could be reached", and a bridge watching seven
      # cameras showed none.
      #
      # Restated in full rather than appended to, because the env override
      # replaces the list wholesale: omitting publish here would stop lostblink
      # publishing at all. No password: the listener is on this project's network
      # and reachable by exactly one container, which is the same boundary every
      # other surface here relies on.
      MTX_AUTHINTERNALUSERS_0_USER: any
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_0_ACTION: publish
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_1_ACTION: read
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_2_ACTION: playback
      MTX_AUTHINTERNALUSERS_0_PERMISSIONS_3_ACTION: api
      MTX_RTSP: "yes"
      MTX_RTSPTRANSPORTS: tcp
      MTX_RTSPADDRESS: :8554
      MTX_HLS: "no"
      MTX_WEBRTC: "no"
      MTX_RTMP: "no"
      MTX_SRT: "no"
      # A live handover splices two MPEG-TS sources, so timestamps jump. Give
      # the muxer room to absorb it.
      MTX_PATHDEFAULTS_WRITEQUEUESIZE: "1024"
      # Blink caps a session at 300s and lostblink splices a replacement under
      # the same ffmpeg, which stops writing until the new tunnel yields a
      # keyframe. That pause is longer than the 10s default, so MediaMTX hung up
      # on the publisher mid-handover:
      #
      #   [RTSP] closed: read tcp …:8554->…: i/o timeout
      #
      # and ffmpeg took a broken pipe and exited 224. Measured: every publisher
      # died at 6m06s, one session plus one splice. This is the gap that has to
      # be tolerated, not a network that is slow.
      MTX_READTIMEOUT: 30s
      MTX_WRITETIMEOUT: 30s
    healthcheck:
      # This image is distroless: no sh, no wget, nothing but the binary. The
      # probe this replaced could never execute at all —
      #   OCI runtime exec failed: exec: "sh": executable file not found in $PATH
      # — so MediaMTX was pinned unhealthy for as long as it ran, lostblink's
      # `condition: service_healthy` gate never opened, and the bridge sat in
      # `Created` forever while the app showed "Verifying…". Probe with the one
      # executable that is actually in the image.
      #
      # Weaker than what it replaced, and knowingly so: this proves the binary
      # runs, not that the API is accepting requests. Distroless leaves no way to
      # make an HTTP request from inside the container, so the start_period below
      # is what covers the listener race the depends_on gate exists for.
      test: ["CMD", "/mediamtx", "--version"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  # Named, and never removed on teardown: whatever a bridge has recorded is not
  # the gateway's to destroy.
  config:
  working:
