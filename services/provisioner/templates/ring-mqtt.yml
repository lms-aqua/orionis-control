# Ring bridge: ring-mqtt, with the MQTT broker it requires.
#
# One of a fixed set of templates the applier will run. Nothing in this file is
# supplied by the gateway or the app — the only variable is ${ORIONIS_INSTANCE},
# which the applier sets from a validated slug, plus the account this bridge
# signs in with.
#
# Ring has no local API. ring-mqtt signs in to Ring's cloud and republishes each
# camera as RTSP through an embedded go2rtc, which is the only surface the
# gateway reads: rtsp://…:8554/<device_id>_live.
#
# Three departures from the stock compose file, each deliberate:
#
#   1. **No published ports.** The stock file exposes 8554 on the host, and the
#      web UI on 55123. Here the gateway joins this project's network instead.
#   2. **A broker of its own.** ring-mqtt exits without one — it is an MQTT
#      bridge first and an RTSP server second. Pointing it at somebody else's
#      broker would mean this template naming a host address, so it gets a
#      private one bound to this project's network and nothing else.
#   3. **The session is seeded, not earned.** ring-mqtt's own sign-in is a
#      browser flow on 55123, and publishing that would put a Ring account auth
#      page on the LAN. The applier writes the refresh token the connection
#      already holds straight into the state file instead — the same trade as
#      the Blink bridge, for the same reason.

services:
  # Writes both files ring-mqtt reads at startup. A sidecar rather than a bind
  # mount: a bind mount would mean this template naming a host path, and "no
  # template touches the host filesystem" is a property worth keeping absolute.
  config:
    image: busybox:1.36
    container_name: orionis-${ORIONIS_INSTANCE}-ring-config
    # Root, like ring-mqtt itself: it rewrites the state file as Ring rotates
    # the refresh token, so the two must agree on who owns it.
    volumes:
      - data:/data
    environment:
      # The refresh token, handed down by the applier. Read from the
      # environment rather than interpolated into the command below so it never
      # appears in `ps` or in this project's compose config output.
      ORIONIS_REFRESHTOKEN: ${ORIONIS_REFRESHTOKEN:-}
    command:
      - sh
      - -c
      - |
        set -e
        # In RUNMODE=docker, ring-mqtt exits immediately when /data/config.json
        # is absent, so this is not optional scaffolding.
        cat > /data/config.json <<'JSON'
        {
          "mqtt_url": "mqtt://mqtt:1883",
          "mqtt_options": "",
          "livestream_user": "",
          "livestream_pass": "",
          "disarm_code": "",
          "enable_cameras": true,
          "enable_modes": false,
          "enable_panic": false,
          "hass_topic": "homeassistant/status",
          "ring_topic": "ring",
          "location_ids": []
        }
        JSON
        # Only ever written when a token was handed over, and never over a state
        # file that already exists: ring-mqtt rotates the refresh token as it
        # runs, so overwriting a live session with the gateway's older copy
        # would sign the bridge out on the next restart.
        # $$ so compose leaves this alone and the shell expands it from the
        # container's environment. A single $ would be interpolated at config
        # time, which puts the token in `docker compose config` output — the
        # one place this arrangement exists to keep it out of.
        if [ -n "$${ORIONIS_REFRESHTOKEN}" ] && [ ! -f /data/ring-state.json ]; then
          printf '{"ring_token":"%s","devices":{}}\n' "$${ORIONIS_REFRESHTOKEN}" > /data/ring-state.json
          chmod 600 /data/ring-state.json
        fi
    restart: "no"

  # ring-mqtt refuses to start without a broker. Anonymous and unreachable from
  # anywhere but this project's network, so there is nothing to authenticate to
  # and nothing else that can reach it.
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: orionis-${ORIONIS_INSTANCE}-mqtt
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        # /tmp rather than /mosquitto/config: the image runs as the mosquitto
        # user, and its config directory is not reliably writable.
        printf 'listener 1883\nallow_anonymous true\npersistence false\n' > /tmp/mosquitto.conf
        exec /usr/sbin/mosquitto -c /tmp/mosquitto.conf
    security_opt:
      - no-new-privileges:true

  ring-mqtt:
    image: ${ORIONIS_RING_IMAGE:-tsightler/ring-mqtt:latest}
    container_name: orionis-${ORIONIS_INSTANCE}-ring-mqtt
    restart: unless-stopped
    depends_on:
      config:
        condition: service_completed_successfully
      mqtt:
        condition: service_started
    environment:
      # Selects the /data/config.json + /data/ring-state.json layout the config
      # sidecar above writes.
      RUNMODE: docker
    volumes:
      - data:/data
    security_opt:
      - no-new-privileges:true

volumes:
  # Holds the Ring session, which ring-mqtt rotates as it runs. Named, and never
  # removed on teardown: the copy in here outlives the one the gateway handed
  # over, and losing it means generating another token by hand.
  data:
