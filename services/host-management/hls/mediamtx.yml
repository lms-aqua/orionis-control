# HLS packager for the Orionis camera pipeline.
#
# go2rtc's own HLS output is unusable: it emits two segments, never advances
# the media sequence, and drops the session after a few seconds. Its RTSP
# output is rock solid, so go2rtc stays the RTSP hub and this repackages it
# into standards-correct HLS for AVPlayer.
logLevel: info
api: no
metrics: no
rtsp: no
rtmp: no
webrtc: no
srt: no

# Reachable only on the internal docker networks (no published ports), and the
# gateway is the sole consumer, so anonymous read is the right call here --
# authorisation for cameras lives in the gateway's signed stream tokens.
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
      - action: playback

# Continuous recording, and the playback server that serves it back.
#
# Retention is bounded explicitly so recordings cannot consume the host without
# limit. Size the duration for the deployment's camera count and available disk.
record: yes
recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
recordFormat: fmp4
recordPartDuration: 1s
recordSegmentDuration: 10m
recordDeleteAfter: 168h

playback: yes
playbackAddress: :9996

hls: yes
hlsAddress: :8888
# Keep the muxer running so tapping a camera starts instantly instead of
# waiting for a cold connect + segment buffer.
hlsAlwaysRemux: yes
hlsVariant: mpegts
hlsSegmentCount: 4
hlsSegmentDuration: 1s
hlsAllowOrigin: '*'

paths:
  # Numeric Scrypted camera ids use the AAC rendition generated by the sync
  # script. Pull on demand so an offline camera cannot create a permanent retry
  # loop merely by existing in configuration.
  "~^([0-9]+)$":
    source: rtsp://orionis-guard-go2rtc-1:8554/$G1_aac
    sourceOnDemand: yes

  # Other names are bridge registrations (for example Blink). They already
  # publish compatible audio and must also remain on-demand because live camera
  # sessions can be metered and battery-backed.
  "~^(.+)$":
    source: rtsp://orionis-guard-go2rtc-1:8554/$G1
    sourceOnDemand: yes
