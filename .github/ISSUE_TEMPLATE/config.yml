blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability privately
    url: https://github.com/lms-aqua/orionis-control/security/advisories/new
    about: >-
      Use this for anything exploitable — authentication bypass, privilege
      escalation, session theft, unauthorised camera or network access. Never
      open a public issue for those.
  - name: Questions and general discussion
    url: https://github.com/lms-aqua/orionis-control/discussions
    about: >-
      This is a proprietary, single-operator project. Deployment and
      configuration details are not published. Open a discussion for
      general questions.
