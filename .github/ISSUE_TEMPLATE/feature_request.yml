name: Feature request
description: Suggest a capability
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >-
        Describe the situation, not the solution. What is awkward or impossible
        today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Cameras and live view
        - Events and recordings
        - Network filtering
        - System health
        - Notifications
        - Settings and accessibility
        - Gateway or API
    validations:
      required: true

  - type: dropdown
    id: upstream
    attributes:
      label: Does the upstream service already support this?
      description: >-
        If Orionis Guard or AdGuard Home cannot do it, the app cannot either.
      options:
        - "Yes — the upstream exposes it"
        - "No — the upstream would need to change first"
        - "Unknown"
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security or privacy considerations
      description: >-
        Would this expose new data, add a privileged action, or widen what the
        app can reach?
