name: iOS CI

on:
  push:
    branches: [main]
    paths:
      [
        "apps/ios/**",
        ".github/workflows/ios-ci.yml",
        ".github/workflows/ios-altstore.yml",
      ]
  pull_request:
    paths:
      [
        "apps/ios/**",
        ".github/workflows/ios-ci.yml",
        ".github/workflows/ios-altstore.yml",
      ]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - uses: actions/checkout@v4

      - name: Verify every UI test has a blocking parallel lane
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          ui_tests = set()
          for source in pathlib.Path("OrionisControlUITests").glob("*.swift"):
              ui_tests.update(re.findall(r"func\s+(test[A-Za-z0-9_]+)\s*\(", source.read_text()))
          workflow = pathlib.Path("../../.github/workflows/ios-ci.yml").read_text()
          lanes = set(re.findall(r"test:\s+OrionisControlUITests/[^/]+/(test[A-Za-z0-9_]+)", workflow))
          missing = sorted(ui_tests - lanes)
          if missing:
              print(f"::error::UI tests missing matrix lanes: {', '.join(missing)}")
              sys.exit(1)
          ui_job = workflow.split("\n  ui-tests:\n", 1)[1]
          if re.search(r"^    continue-on-error:\s*true\s*$", ui_job, re.MULTILINE):
              print("::error::The UI test job must block releases when XCTest fails.")
              sys.exit(1)
          build_step = ui_job.split("- name: Build and run UI tests", 1)[1]
          build_step = build_step.split("\n      - name:", 1)[0]
          if "continue-on-error: true" in build_step:
              print("::error::The UI test execution step must not hide XCTest failures.")
              sys.exit(1)
          print(f"Every UI test has a blocking matrix lane ({len(ui_tests)} total).")
          PY

      - name: Select the newest available Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then
            echo "::error::No Xcode installation found on the runner"
            exit 1
          fi
          echo "Using $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-xcodegen

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Provide a CI build configuration
        run: |
          # Real xcconfigs are gitignored. CI uses the example values so the
          # project builds without any secret being present.
          mkdir -p Config
          cp Config/Development.xcconfig.example Config/Development.xcconfig

      - name: Generate the Xcode project
        run: |
          xcodegen generate --spec project.yml
          test -d OrionisControl.xcodeproj || { echo "::error::Project generation produced no .xcodeproj"; exit 1; }

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OrionisControl.xcodeproj \
            -scheme OrionisControl

      - name: Pick a simulator
        id: sim
        run: |
          # Selects by UDID, not by name. `-destination "...,name=X"` implies
          # OS:latest, so it fails whenever the newest installed runtime has no
          # device of that name — which is exactly what the runner image looks
          # like now (an iPhone 16e on iOS 26.2 beside iPhone 17s on 26.5).
          # A UDID names one concrete device on one concrete runtime.
          SELECTED=$(xcrun simctl list devices available --json | python3 -c "
          import json, re, sys
          data = json.load(sys.stdin)['devices']
          def version(runtime):
              found = re.search(r'iOS-([0-9]+(?:-[0-9]+)*)', runtime)
              return tuple(int(part) for part in found.group(1).split('-')) if found else ()
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if not device.get('isAvailable') or 'iPhone' not in device['name']:
                      continue
                  key = (version(runtime), device['name'])
                  if best is None or key > best[0]:
                      best = (key, device['udid'], device['name'])
          if best:
              print(best[1], best[2], '.'.join(str(part) for part in best[0][0]))
          ")
          if [ -z "$SELECTED" ]; then
            echo "::error::No available iPhone simulator on the runner"
            exit 1
          fi
          echo "Using simulator: $SELECTED"
          echo "udid=$(echo "$SELECTED" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project OrionisControl.xcodeproj \
            -scheme OrionisControl \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:OrionisControlTests \
            -resultBundlePath TestResults-unit.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee test-unit.log

      - name: Report new warnings
        if: always()
        run: |
          COUNT=$(grep -c "warning:" test-unit.log || true)
          echo "Compiler warnings: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            grep "warning:" test-unit.log | sort -u | head -50
            echo "::warning::$COUNT compiler warning(s). Resolve or document them."
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-test-results
          path: |
            apps/ios/TestResults-unit.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-logs
          path: apps/ios/*.log
          if-no-files-found: ignore
          retention-days: 7

  release-build:
    name: Release build verification
    # Compile the production configuration in parallel with both test suites.
    # AltStore still performs its own archive after the whole workflow passes.
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then echo "::error::No Xcode on runner"; exit 1; fi
          sudo xcode-select -s "$LATEST/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the production project
        run: |
          mkdir -p Config
          cp Config/Development.xcconfig.example Config/Development.xcconfig
          cp Config/Production.xcconfig.example Config/Production.xcconfig
          xcodegen generate --spec project.yml

      - name: Build Release (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project OrionisControl.xcodeproj \
            -scheme OrionisControl \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee build-release.log

      - name: Upload Release log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-release-build-log
          path: apps/ios/build-release.log
          if-no-files-found: ignore
          retention-days: 7

  ui-tests:
    name: UI — ${{ matrix.name }}
    # Each UI test gets its own macOS runner. This keeps every flow visible while
    # avoiding five serial app launches and network waits on one simulator.
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: first-launch
            test: OrionisControlUITests/LaunchUITests/testFirstLaunchShowsWelcomeAndExplainsPrivacy
          - name: gateway-entry
            test: OrionisControlUITests/LaunchUITests/testGettingStartedRevealsTheGatewayField
          - name: unreachable-gateway
            test: OrionisControlUITests/LaunchUITests/testUnreachableGatewayProducesAnActionableError
          - name: dynamic-type
            test: OrionisControlUITests/LaunchUITests/testWelcomeScreenSupportsLargeDynamicType
          - name: credential-privacy
            test: OrionisControlUITests/LaunchUITests/testNoPasswordFieldIsEverPresented
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then echo "::error::No Xcode on runner"; exit 1; fi
          sudo xcode-select -s "$LATEST/Contents/Developer"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the CI project
        run: |
          mkdir -p Config
          cp Config/Development.xcconfig.example Config/Development.xcconfig
          xcodegen generate --spec project.yml

      - name: Pick a simulator
        id: sim
        run: |
          # Selects by UDID, not by name. `-destination "...,name=X"` implies
          # OS:latest, so it fails whenever the newest installed runtime has no
          # device of that name — which is exactly what the runner image looks
          # like now (an iPhone 16e on iOS 26.2 beside iPhone 17s on 26.5).
          # A UDID names one concrete device on one concrete runtime.
          SELECTED=$(xcrun simctl list devices available --json | python3 -c "
          import json, re, sys
          data = json.load(sys.stdin)['devices']
          def version(runtime):
              found = re.search(r'iOS-([0-9]+(?:-[0-9]+)*)', runtime)
              return tuple(int(part) for part in found.group(1).split('-')) if found else ()
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if not device.get('isAvailable') or 'iPhone' not in device['name']:
                      continue
                  key = (version(runtime), device['name'])
                  if best is None or key > best[0]:
                      best = (key, device['udid'], device['name'])
          if best:
              print(best[1], best[2], '.'.join(str(part) for part in best[0][0]))
          ")
          if [ -z "$SELECTED" ]; then
            echo "::error::No available iPhone simulator on the runner"
            exit 1
          fi
          echo "Using simulator: $SELECTED"
          echo "udid=$(echo "$SELECTED" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build and run UI tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project OrionisControl.xcodeproj \
            -scheme OrionisControl \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:${{ matrix.test }} \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -resultBundlePath "TestResults-ui-${{ matrix.name }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee test-ui.log

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-results-${{ matrix.name }}
          path: apps/ios/TestResults-ui-${{ matrix.name }}.xcresult
          if-no-files-found: ignore
          retention-days: 14
