name: iOS AltStore

# Builds an UNSIGNED IPA and publishes it, together with an AltStore/SideStore
# source, to a rolling "ios_latest" pre-release. AltStore re-signs the app
# on-device with the installing user's own Apple ID, so no distribution
# certificate is required here. The source and download URLs are stable:
#
#   Source: https://github.com/<owner>/<repo>/releases/download/ios_latest/altstore-source.json
#   IPA:    Read the current unique downloadURL from altstore-source.json.

on:
  workflow_run:
    workflows: ["iOS CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ios-altstore
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  package:
    name: Package unsigned IPA and publish source
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios

    steps:
      - uses: actions/checkout@v4
        with:
          # Package exactly what iOS CI validated, even if main advances while
          # this downstream workflow is waiting for a runner.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Select the newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST" ]; then echo "::error::No Xcode on runner"; exit 1; fi
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Provide a CI build configuration
        run: |
          # Real xcconfigs are gitignored; use the sanitized examples so the
          # build needs no secret. The gateway URL is entered at first launch.
          mkdir -p Config
          cp Config/Development.xcconfig.example Config/Development.xcconfig
          cp Config/Production.xcconfig.example Config/Production.xcconfig

      - name: Generate the Xcode project
        run: |
          xcodegen generate --spec project.yml
          test -d OrionisControl.xcodeproj || { echo "::error::No .xcodeproj generated"; exit 1; }

      - name: Archive (unsigned, Release)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OrionisControl.xcodeproj \
            -scheme OrionisControl \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/OrionisControl.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee archive.log

      - name: Package the unsigned IPA
        id: ipa
        run: |
          set -euo pipefail
          APP="build/OrionisControl.xcarchive/Products/Applications/OrionisControl.app"
          test -d "$APP" || { echo "::error::Archive produced no .app"; exit 1; }

          # Stamp a monotonically increasing build number so AltStore/SideStore
          # can detect each rolling build as an update. The marketing version
          # (CFBundleShortVersionString) is left untouched.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$APP/Info.plist"

          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")

          rm -rf build/Payload && mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          # Unique filename per build: overwriting one fixed asset URL let GitHub's
          # release CDN serve a stale IPA against a fresh source.json, which AltStore
          # rejects as a SHA-256 mismatch. A fresh URL each build has nothing stale
          # to cache.
          IPA_NAME="OrionisControl-${{ github.run_number }}.ipa"
          (cd build && zip -qry "$IPA_NAME" Payload)

          SIZE=$(stat -f%z "build/$IPA_NAME")
          SHA=$(shasum -a 256 "build/$IPA_NAME" | awk '{print $1}')
          # Full timestamp, not a bare date. A date-only value is read as UTC
          # midnight, and UTC midnight is the previous evening in the Americas --
          # so a build published today showed up in the installer as "yesterday".
          # Use a numeric +00:00 offset, NOT the Zulu 'Z' suffix: AltStore's source
          # decoder rejects 'Z' with "data couldn't be read ... not the correct
          # format". Its documented ISO-8601 examples all use a numeric offset.
          DATE=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)

          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "size=$SIZE"
            echo "sha=$SHA"
            echo "date=$DATE"
            echo "ipa_name=$IPA_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Packaged $IPA_NAME — v$VERSION ($BUILD), ${SIZE} bytes"

      - name: Generate the AltStore source
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.ipa.outputs.version }}
          BUILD: ${{ steps.ipa.outputs.build }}
          SIZE: ${{ steps.ipa.outputs.size }}
          SHA: ${{ steps.ipa.outputs.sha }}
          DATE: ${{ steps.ipa.outputs.date }}
          IPA_NAME: ${{ steps.ipa.outputs.ipa_name }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          repo    = os.environ["REPO"]
          version = os.environ["VERSION"]
          build   = os.environ["BUILD"]
          size    = int(os.environ["SIZE"])
          sha     = os.environ["SHA"]
          date    = os.environ["DATE"]

          ipa  = f"https://github.com/{repo}/releases/download/ios_latest/{os.environ['IPA_NAME']}"
          icon = f"https://raw.githubusercontent.com/{repo}/main/.github/altstore/icon.png"
          desc = (
              "Orionis Control is a native app for self-hosted infrastructure: cameras and "
              "live streams, DNS filtering, and system health, behind OIDC + PKCE "
              f"authentication. Unsigned rolling build (CI run {build}); AltStore signs it "
              "on-device with your own Apple ID."
          )
          release_notes = Path("RELEASE_NOTES.md")
          notes = (
              release_notes.read_text(encoding="utf-8").strip()
              if release_notes.exists()
              else f"Rolling development build (CI run {build})."
          )
          if not notes:
              notes = f"Rolling development build (CI run {build})."

          version_entry = {
              "version": version,
              "buildVersion": build,
              "date": date,
              "localizedDescription": notes,
              "downloadURL": ipa,
              "size": size,
              "sha256": sha,
              # Must track IPHONEOS_DEPLOYMENT_TARGET in apps/ios/project.yml.
              # If this advertises a lower floor than the binary supports,
              # AltStore offers the build to devices that cannot run it.
              "minOSVersion": "18.0",
          }

          source = {
              "name": "Orionis Control",
              "identifier": "com.lostmediastudios.orioniscontrol.altsource",
              "subtitle": "Cameras, DNS filtering and system health.",
              "iconURL": icon,
              "tintColor": "3B6BE0",
              "apps": [
                  {
                      "name": "Orionis Control",
                      "bundleIdentifier": "com.lostmediastudios.orioniscontrol",
                      "developerName": "Lost Media Studios",
                      "subtitle": "One native app for the cameras, the network, and system health.",
                      "localizedDescription": desc,
                      "iconURL": icon,
                      "tintColor": "3B6BE0",
                      "category": "utilities",
                      "screenshotURLs": [],
                      # Legacy top-level fields for older AltStore clients.
                      "version": version,
                      "versionDate": date,
                      "versionDescription": notes,
                      "downloadURL": ipa,
                      "size": size,
                      "sha256": sha,
                      # Modern AltStore/SideStore versions array (newest first).
                      "versions": [version_entry],
                  }
              ],
              "news": [],
          }

          with open("altstore-source.json", "w") as fh:
              json.dump(source, fh, indent=2)
          print(open("altstore-source.json").read())
          PY

      - name: Publish the rolling ios_latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # GitHub does not move an existing rolling tag when its assets are
          # replaced. Move it explicitly so the release page, source JSON and
          # IPA identify the exact commit that passed iOS CI.
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || {
            echo "::error::Checked-out SHA does not match the validated iOS CI SHA"
            exit 1
          }
          git tag --force ios_latest "$RELEASE_SHA"
          git push --force origin refs/tags/ios_latest

          if ! gh release view ios_latest >/dev/null 2>&1; then
            gh release create ios_latest \
              --target "$RELEASE_SHA" \
              --prerelease \
              --latest=false \
              --title "Orionis Control — iOS (rolling, unsigned)" \
              --notes "Unsigned rolling build for AltStore / SideStore. The app is re-signed on-device with your own Apple ID. Add the AltStore source: https://github.com/${{ github.repository }}/releases/download/ios_latest/altstore-source.json"
          fi
          gh release edit ios_latest --target "$RELEASE_SHA"
          gh release upload ios_latest \
            "build/${{ steps.ipa.outputs.ipa_name }}" \
            altstore-source.json \
            --clobber
          # Prune older rolling IPAs so the release does not grow without bound;
          # keep only the one this build just published. (source.json keeps its
          # stable filename, so existing installs still find the source.)
          for asset in $(gh release view ios_latest --json assets \
            --jq '.assets[].name' | grep -E '^OrionisControl(-[0-9]+)?\.ipa$' || true); do
            if [ "$asset" != "${{ steps.ipa.outputs.ipa_name }}" ]; then
              gh release delete-asset ios_latest "$asset" -y || true
            fi
          done

      - name: Upload IPA as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orionis-control-unsigned-ipa
          path: apps/ios/build/OrionisControl-*.ipa
          if-no-files-found: ignore
          retention-days: 14
