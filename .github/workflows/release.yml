name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
      notes:
        description: "Optional release notes (overrides commit-history notes)"
        required: false

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify before release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: services/mobile-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/mobile-api/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Confirm the OpenAPI contract is current
        run: |
          npm run openapi
          git diff --quiet -- ../../packages/api-contract/openapi.json \
            || { echo "::error::OpenAPI contract is stale"; exit 1; }

  backend-image:
    name: Build and publish the gateway image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/mobile-api
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/mobile-api:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository }}/mobile-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image and checksum
        run: |
          docker pull "ghcr.io/${{ github.repository }}/mobile-api:${{ steps.version.outputs.value }}"
          docker save "ghcr.io/${{ github.repository }}/mobile-api:${{ steps.version.outputs.value }}" \
            | gzip > mobile-api-${{ steps.version.outputs.value }}.tar.gz
          sha256sum mobile-api-${{ steps.version.outputs.value }}.tar.gz > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            mobile-api-*.tar.gz
            checksums.txt
          retention-days: 30

  ios-archive:
    name: iOS archive
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/ios
    outputs:
      signed: ${{ steps.signing.outputs.available }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version

      - run: brew install xcodegen

      - name: Determine whether signing is configured
        id: signing
        env:
          CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are configured; a signed archive will be produced."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing secrets are not configured. Producing an UNSIGNED archive."
          fi

      - name: Prepare configuration
        run: |
          mkdir -p Config
          if [ -n "${{ secrets.IOS_PRODUCTION_XCCONFIG }}" ]; then
            printf '%s' '${{ secrets.IOS_PRODUCTION_XCCONFIG }}' > Config/Production.xcconfig
          else
            cp Config/Production.xcconfig.example Config/Production.xcconfig
          fi

      - run: xcodegen generate --spec project.yml

      - name: Archive (unsigned)
        if: steps.signing.outputs.available == 'false'
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OrionisControl.xcodeproj \
            -scheme OrionisControl \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/OrionisControl.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee archive.log
          cd build && zip -qr OrionisControl-unsigned.xcarchive.zip OrionisControl.xcarchive
          shasum -a 256 OrionisControl-unsigned.xcarchive.zip > archive-checksum.txt

      - name: Archive (signed)
        if: steps.signing.outputs.available == 'true'
        env:
          CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -o pipefail
          # Secrets are written to a temporary keychain and never echoed.
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign > /dev/null 2>&1
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/orionis.mobileprovision

          xcodebuild archive \
            -project OrionisControl.xcodeproj \
            -scheme OrionisControl \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/OrionisControl.xcarchive \
            | tee archive.log

          rm -f "$RUNNER_TEMP/cert.p12"
          cd build && shasum -a 256 -q OrionisControl.xcarchive > /dev/null || true

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive
          # Only the unsigned zip is uploaded. A signed archive contains
          # provisioning data and is never published as an artifact.
          path: |
            apps/ios/build/OrionisControl-unsigned.xcarchive.zip
            apps/ios/build/archive-checksum.txt
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish release
    needs: [backend-image, ios-archive]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assemble release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          NOTES_INPUT=$(cat <<'ORIONIS_NOTES_EOF'
          ${{ github.event.inputs.notes }}
          ORIONIS_NOTES_EOF
          )
          # Release notes come from an explicit dispatch input when provided, and
          # otherwise from the commit history since the previous tag. The
          # changelog is intentionally local-only and is never read here.
          if [ -n "$(printf '%s' "$NOTES_INPUT" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$NOTES_INPUT" > release-notes.md
          else
            PREV=$(git describe --tags --abbrev=0 "v${VERSION}^" 2>/dev/null \
              || git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            {
              echo "### Changes"
              if [ -n "$PREV" ]; then
                git log --no-merges --pretty='- %s (%h)' "${PREV}..HEAD"
              else
                git log --no-merges --pretty='- %s (%h)' -30
              fi
            } > release-notes.md
          fi
          cat release-notes.md

      - name: Download gateway release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/release-artifacts

      - name: Download iOS archive artifacts
        uses: actions/download-artifact@v4
        with:
          name: ios-archive
          path: artifacts/ios-archive

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          {
            echo "> Signed iOS builds require Apple signing secrets, which are configured separately."
            echo "> Where those are absent, only an unsigned archive is produced."
            echo
            cat release-notes.md
          } > body.md

          FILES=$(find artifacts -type f \( -name '*.tar.gz' -o -name 'checksums.txt' -o -name '*.zip' -o -name 'archive-checksum.txt' \) | tr '\n' ' ')
          gh release create "v$VERSION" $FILES \
            --title "Orionis Control v$VERSION" \
            --notes-file body.md \
            --generate-notes \
            --prerelease
